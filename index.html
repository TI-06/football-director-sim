<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06182d">
  <meta name="description" content="戦術・育成・移籍・財務を管理するブラウザサッカー経営シミュレーション">
  <title>Football Director</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/mobile-game-v2.css">
  <script type="importmap">
    {
      "imports": {
        "./src/ui/render.js": "./src/ui/render-v2.js"
      }
    }
  </script>
</head>
<body>
  <div id="app" aria-live="polite">

    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <input id="save-import" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/ui/mobile-interactions-v2.js"></script>

</html>
