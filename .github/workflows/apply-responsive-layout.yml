name: Apply responsive layout

on:
  pull_request:
    branches:
      - main
    paths:
      - .responsive-transfer/responsive-layout.patch.gz.b64
      - .github/workflows/apply-responsive-layout.yml
  push:
    branches:
      - feature/responsive-layout-audit
    paths:
      - .responsive-transfer/responsive-layout.patch.gz.b64
      - .github/workflows/apply-responsive-layout.yml

permissions:
  contents: write

concurrency:
  group: apply-responsive-layout
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/responsive-layout-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cp .responsive-transfer/responsive-layout.patch.gz.b64 /tmp/responsive-layout.patch.gz.b64
          test "$(wc -c < /tmp/responsive-layout.patch.gz.b64)" -eq 16728
          echo "92e3a94055adf3bad535e3e9a7cf0bab5d89b4abb7c1b79d6e3130dab889335b  /tmp/responsive-layout.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/responsive-layout.patch.gz.b64 > /tmp/responsive-layout.patch.gz
          echo "5cf5445a7207aa4de3a85faa371c754e2ba450a35079b8bee1e3c1929f7567f8  /tmp/responsive-layout.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/responsive-layout.patch.gz > /tmp/responsive-layout.patch
          echo "ad41e170420e8d8c61975999f0c105196387bf80f1e74418a0c3e4dc459d44a5  /tmp/responsive-layout.patch" | sha256sum -c -
          git apply --index --whitespace=error /tmp/responsive-layout.patch
          rm -rf .responsive-transfer
          rm -f .github/workflows/apply-responsive-layout.yml
          git add -A
          git diff --cached --check
      - name: Install dependencies and Chromium
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Run unit tests
        run: node --test --test-reporter=dot
      - name: Run quality checks
        run: npm run check
      - name: Run HTTP smoke test
        run: npm run smoke
      - name: Run production build
        run: npm run build
      - name: Run seven-viewport Chromium audit
        run: npm run test:responsive -- --reporter=line
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-apply-evidence
          path: |
            playwright-report
            test-results
            responsive-screenshots
          if-no-files-found: warn
          retention-days: 2
      - name: Commit clean feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: optimize responsive game layouts"
          git push origin HEAD:refs/heads/feature/responsive-layout-audit
