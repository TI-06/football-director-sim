name: Export latest source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
      - name: Package repository
        shell: bash
        run: |
          tar --exclude=.git --exclude=.github/workflows/export-latest-source.yml -czf /tmp/football-director-latest.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-director-latest-source
          path: /tmp/football-director-latest.tgz
          retention-days: 1
