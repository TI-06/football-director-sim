name: Apply Japanese pyramid career source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/japan-pyramid-career
          fetch-depth: 0
      - name: Restore verified source when staged
        shell: bash
        run: |
          if [ -d .source-japan ]; then
            printf 'T' | dd of=.source-japan/chunk06 bs=1 seek=402 conv=notrunc status=none
            cat .source-japan/chunk* | base64 --decode > /tmp/japan-career.tgz
            echo "39c2e8d3b5990c4a83b80fd3f1a68e988ec8d3fc2fb0538fd41b691a0af6845a  /tmp/japan-career.tgz" | sha256sum --check --strict
            tar -xzf /tmp/japan-career.tgz -C .
            rm -rf .source-japan .source-japan-fix .source-japan-fix2
          fi
      - name: Verify application
        run: npm run verify && npm run build
      - name: Commit restored source
        shell: bash
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: add japanese three-division career system"
            git push origin HEAD:feature/japan-pyramid-career
          fi
