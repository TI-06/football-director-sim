name: Export UI source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          mkdir -p "$RUNNER_TEMP/ui-source"
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf "$RUNNER_TEMP/ui-source/football-director-ui-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/ui-source/football-director-ui-source.tar.gz" > "$RUNNER_TEMP/ui-source/football-director-ui-source.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: football-director-ui-source
          path: |
            ${{ runner.temp }}/ui-source/football-director-ui-source.tar.gz
            ${{ runner.temp }}/ui-source/football-director-ui-source.tar.gz.sha256
          retention-days: 2
