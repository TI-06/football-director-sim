name: Chibi mobile game UI bootstrap

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/ui-transfer/**'
      - '.github/workflows/chibi-ui-verify.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconstruct and apply reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/ui-transfer
          python - <<'PY'
          from pathlib import Path
          import base64

          parts = sorted(Path('.github/ui-transfer').glob('chibi-upload-*'))
          if not parts:
              raise SystemExit('No transfer parts found.')

          texts = [''.join(path.read_text(encoding='utf-8').split()) for path in parts]
          print('Parts:', len(parts))
          print('Part lengths:', ','.join(str(len(text)) for text in texts))

          candidates = []
          joined = ''.join(texts)
          candidates.append(('joined-standard', lambda: base64.b64decode(joined, validate=True)))
          candidates.append(('joined-urlsafe', lambda: base64.urlsafe_b64decode(joined + '=' * (-len(joined) % 4))))
          candidates.append(('per-part-standard', lambda: b''.join(base64.b64decode(text, validate=True) for text in texts)))
          candidates.append(('per-part-urlsafe', lambda: b''.join(base64.urlsafe_b64decode(text + '=' * (-len(text) % 4)) for text in texts)))

          errors = []
          for name, decoder in candidates:
              try:
                  payload = decoder()
              except Exception as exc:
                  errors.append(f'{name}: {exc}')
                  continue
              Path('/tmp/chibi-ui.payload').write_bytes(payload)
              print('Decoded mode:', name)
              print('Payload bytes:', len(payload))
              break
          else:
              raise SystemExit('Unable to decode transfer parts. ' + ' | '.join(errors))
          PY

          sha256sum /tmp/chibi-ui.payload
          file /tmp/chibi-ui.payload

          if gzip -t /tmp/chibi-ui.payload 2>/dev/null; then
            gzip -dc /tmp/chibi-ui.payload > /tmp/chibi-ui.decoded
          else
            cp /tmp/chibi-ui.payload /tmp/chibi-ui.decoded
          fi

          echo "Decoded bytes: $(wc -c < /tmp/chibi-ui.decoded)"
          sha256sum /tmp/chibi-ui.decoded
          file /tmp/chibi-ui.decoded

          if grep -aq '^diff --git ' /tmp/chibi-ui.decoded; then
            git apply --check --binary /tmp/chibi-ui.decoded
            git apply --binary /tmp/chibi-ui.decoded
          elif tar -tf /tmp/chibi-ui.decoded >/tmp/chibi-ui-files.txt 2>/dev/null; then
            tar -xf /tmp/chibi-ui.decoded
          elif unzip -t /tmp/chibi-ui.decoded >/tmp/chibi-ui-files.txt 2>/dev/null; then
            unzip -o /tmp/chibi-ui.decoded
          else
            echo 'Unsupported UI transfer payload.' >&2
            xxd -l 64 /tmp/chibi-ui.decoded >&2
            exit 1
          fi

          files="$(git diff --name-only)"
          echo "$files"
          echo "$files" | grep -qx 'src/styles.css'
          echo "$files" | grep -qx 'src/ui/render.js'
          echo "$files" | grep -q '^tests/'
          rm -rf .github/ui-transfer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regression tests
        run: npm test
      - name: Quality check
        run: npm run check
      - name: HTTP smoke
        run: npm run smoke
      - name: Production build
        run: npm run build
      - name: Responsive browser audit
        run: npm run test:responsive
      - name: Commit verified implementation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply chibi sports game interface'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chibi-mobile-ui-evidence
          path: |
            test-results/
            playwright-report/
            responsive-screenshots/
          if-no-files-found: warn
          retention-days: 14
