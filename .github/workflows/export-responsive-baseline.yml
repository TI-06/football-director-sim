name: Export responsive baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source tree
        run: |
          git archive --format=tar.gz --output=responsive-baseline.tar.gz HEAD
          sha256sum responsive-baseline.tar.gz > responsive-baseline.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: responsive-baseline-source
          path: |
            responsive-baseline.tar.gz
            responsive-baseline.tar.gz.sha256
          retention-days: 2
