name: Bootstrap source

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - .bootstrap-pr-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Restore and verify project
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:.bootstrap/chunk01b > /tmp/chunk01b
          head -c 10000 .bootstrap/chunk00 > /tmp/chunk00a
          tail -c 10000 .bootstrap/chunk00 > /tmp/chunk00b
          head -c 10000 .bootstrap/chunk06 > /tmp/chunk06a
          set +e
          cat \
            .bootstrap/chunk00 \
            .bootstrap/chunk01 \
            /tmp/chunk01b \
            .bootstrap/chunk03 \
            .bootstrap/chunk04 \
            .bootstrap/chunk05 \
            /tmp/chunk06a \
            .bootstrap/chunk07 \
            .bootstrap/chunk08 \
            .bootstrap/chunk09a \
            .bootstrap/chunk09b \
            .bootstrap/chunk09c \
            .bootstrap/chunk09d \
            > /tmp/football-director-source.b64

          {
            echo "expected_chunk00a=8d2edfec7e96d428d112f788f2b95f5d5e0931852f5162be36501ed8c592c0b6"
            echo "expected_chunk00b=a99f45f9bc5508e1f91adafded0733ac9c99d9ae10f5feaec5b17ed1ee996f68"
            echo "expected_chunk06a=8e6603c2757916a7d1b07cf1da5ea70a706247413d2ce33fd4c9742748096069"
            sha256sum /tmp/chunk00a /tmp/chunk00b /tmp/chunk06a
            echo "base64_bytes=$(wc -c < /tmp/football-director-source.b64)"
            base64 --decode /tmp/football-director-source.b64 > /tmp/football-director-source.zip
            decode_status=$?
            echo "decode_status=$decode_status"
            echo "actual_sha256=$(sha256sum /tmp/football-director-source.zip | cut -d' ' -f1)"
            echo "expected_sha256=c1af393010663b43f138a4ab683ea4c0c819b0dffa58968b92a481f86bb1190c"
            unzip -t /tmp/football-director-source.zip
            unzip_status=$?
            echo "unzip_status=$unzip_status"
          } > bootstrap-diagnostic.txt 2>&1

          actual_sha=$(sha256sum /tmp/football-director-source.zip | cut -d' ' -f1)
          if [ "$actual_sha" != "c1af393010663b43f138a4ab683ea4c0c819b0dffa58968b92a481f86bb1190c" ]; then
            cat bootstrap-diagnostic.txt
            exit 1
          fi

          unzip -o /tmp/football-director-source.zip -d .
          npm run verify >> bootstrap-diagnostic.txt 2>&1
          verify_status=$?
          echo "verify_status=$verify_status" >> bootstrap-diagnostic.txt
          npm run build >> bootstrap-diagnostic.txt 2>&1
          build_status=$?
          echo "build_status=$build_status" >> bootstrap-diagnostic.txt
          cat bootstrap-diagnostic.txt
          test "$verify_status" -eq 0 -a "$build_status" -eq 0

      - name: Commit diagnostic on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap-diagnostic.txt
          git commit -m "chore: record bootstrap diagnostic" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Replace bootstrap files with source
        if: success()
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .bootstrap-trigger .bootstrap-pr-trigger bootstrap-diagnostic.txt
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import football director simulation"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
