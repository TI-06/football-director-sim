name: Apply live match mobile shell

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-match-mobile-shell
          fetch-depth: 0
      - name: Upload staged archive for diagnosis
        if: ${{ hashFiles('.source/live-match-mobile-shell.tgz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-match-mobile-shell-diagnostic
          path: .source/live-match-mobile-shell.tgz
          retention-days: 1
      - name: Restore verified source
        shell: bash
        run: |
          if [ -f .source/live-match-mobile-shell.tgz ]; then
            echo "ef142af248ac99cc7af0bc9478066ce72f9cf7cc96337cc520de42fb2137b27f  .source/live-match-mobile-shell.tgz" | sha256sum --check --strict
            tar -xzf .source/live-match-mobile-shell.tgz -C .
            rm -rf .source .github/workflows/apply-live-match-mobile-shell.yml
          fi
      - name: Verify application
        run: npm run verify && npm run build
      - name: Commit restored source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: add live match tactics and mobile game shell"
            git push origin HEAD:feature/live-match-mobile-shell
          fi
