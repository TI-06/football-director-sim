name: Import verified source v2

on:
  pull_request:
    types: [opened]
    paths:
      - .source-v2-trigger

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify and restore source
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/chunks.sha256 <<'EOF'
          060c51acb7498ce59d3fecb2c7c21b7fa23449a1ac6955eb567a2b84d1e5a306  .source-v2/chunk00
          f28448971f299fddec333f47623dfaaf35f828395ffa2d484ef55f5614e7f617  .source-v2/chunk01
          acd9551ec4877ab4c7603f312347a6e8ea036dbc83e30d6648202145d53224c3  .source-v2/chunk02
          889be10e3b3bc0d8e067e6067ed4542ed1d05d8355d3f6f30d7f494b78e180cc  .source-v2/chunk03
          3bbcc09df8aaeca72fb8f16d9218334df4cb69184a58514266aa1b316f50c495  .source-v2/chunk04
          c967849a2e3df50785781ae767318fcf1e3cc24187bff8628b13a3a5fa78f7cb  .source-v2/chunk05
          a08032a9710a6ed2e0153f094f9f02722faa7522b6b8c9148456dc79feb5fe7a  .source-v2/chunk06
          30b83bff189e25b0e35618ee7bbf2e8a6e371374bcaf8076f00fc1b35d173700  .source-v2/chunk07
          2b2dcde30f8aab6005356be8105b76d731269824c0c47224f06450391e3c291f  .source-v2/chunk08
          1d9900d2c14b8c5fd48fb4e9c9aa5871daf8ba7a5b61c0370990a100b7bcec65  .source-v2/chunk09
          ccde2839b0ad8e8270f2af89bbf7bcff95cbb16ffb419539dbaab6f8d6e017f8  .source-v2/chunk10
          3b6af1328231c62a8d1dc5a132d0bf8ff376f50a2e024e883344cbecd7b3977a  .source-v2/chunk11
          575353a1194a15a2a2ef249ca46a0879f27f3b6221cf315845c677fc26733ffa  .source-v2/chunk12
          bb0bc0c1513d686776ecf55dcb18e6ada482209ffef7f55fe53b43e914d5940e  .source-v2/chunk13
          EOF
          sha256sum --check /tmp/chunks.sha256

          cat .source-v2/chunk{00..13} > /tmp/football-director-source.b64
          test "$(wc -c < /tmp/football-director-source.b64)" -eq 109240
          base64 --decode /tmp/football-director-source.b64 > /tmp/football-director-source.zip
          echo "c1af393010663b43f138a4ab683ea4c0c819b0dffa58968b92a481f86bb1190c  /tmp/football-director-source.zip" | sha256sum --check
          unzip -t /tmp/football-director-source.zip

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/football-director-source.zip -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Run verification suite
        run: |
          npm run verify
          npm run build

      - name: Commit verified application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import football director simulation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
