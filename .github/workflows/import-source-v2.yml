name: Import verified source v2

on:
  pull_request:
    types: [opened]
    paths:
      - .source-v2-trigger

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify and restore source
        run: bash .source-v2/import.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Run verification suite
        run: |
          npm run verify
          npm run build

      - name: Commit verified application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import football director simulation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
