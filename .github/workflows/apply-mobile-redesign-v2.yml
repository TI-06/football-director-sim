name: Apply Mobile Redesign V2

on:
  push:
    branches:
      - feat/mobile-redesign-v2
    paths:
      - scripts/apply-mobile-redesign-v2.mjs
      - .github/workflows/apply-mobile-redesign-v2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mobile-redesign-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Apply redesign migration
        run: node scripts/apply-mobile-redesign-v2.mjs
      - name: Unit and integration tests
        run: npm test
      - name: Static quality check
        run: npm run check
      - name: HTTP smoke check
        run: npm run smoke
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive browser audit
        run: npm run test:responsive
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: rebuild mobile football director UI"
            git push origin HEAD:feat/mobile-redesign-v2
          fi
