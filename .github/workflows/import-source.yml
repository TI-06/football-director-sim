name: Import verified source

on:
  pull_request:
    types:
      - opened
    paths:
      - .import-source-trigger

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restore checked archive
        shell: bash
        run: |
          cat \
            .bootstrap/chunk00a \
            .bootstrap/chunk00b \
            .bootstrap/chunk01 \
            .bootstrap/chunk01b \
            .bootstrap/chunk03 \
            .bootstrap/chunk04 \
            .bootstrap/chunk05 \
            .bootstrap/chunk06 \
            .bootstrap/chunk07 \
            .bootstrap/chunk08 \
            .bootstrap/chunk09a \
            .bootstrap/chunk09b \
            .bootstrap/chunk09c \
            .bootstrap/chunk09d \
            > /tmp/source.b64
          printf '==' >> /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "c1af393010663b43f138a4ab683ea4c0c819b0dffa58968b92a481f86bb1190c  /tmp/source.zip" | sha256sum -c -
          unzip -t /tmp/source.zip
          unzip -o /tmp/source.zip -d .
      - name: Commit imported source
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .bootstrap-trigger .bootstrap-pr-trigger .bootstrap-fixed-trigger .import-source-trigger bootstrap-diagnostic.txt IMPORT_REQUEST.md
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import football director simulation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
